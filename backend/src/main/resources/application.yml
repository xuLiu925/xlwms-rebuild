server:
  port: 8080
spring:
  application:
    name: xlwms-rebuild
  # 本地开发数据库；密码只用环境变量占位，不写进仓库。默认 root + 空密码。
  datasource:
    url: jdbc:mysql://localhost:3306/xlwms_dev?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 每次启动用 schema.sql 重建表、data.sql 灌入虚构示例数据（本地开发，可重复）。
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql,classpath:db/schema-list.sql
      data-locations: classpath:db/data.sql,classpath:db/data-list.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
